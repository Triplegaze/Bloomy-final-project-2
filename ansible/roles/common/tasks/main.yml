---
- name: Update apt package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade installed packages
  apt:
    upgrade: dist

- name: Install required packages
  apt:
    name:
      - git
      - curl
      - unzip
      - python3-pip
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
