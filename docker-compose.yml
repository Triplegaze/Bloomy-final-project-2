services:
  portfolio:
    build:
      context: ./portfolio
    image: bloomy/portfolio:latest
    container_name: portfolio-app
    ports:
      - "5000:5000"
    restart: unless-stopped

  java-app:
    build:
      context: ./samplejavaapp
    image: bloomy/java-app:latest
    container_name: java-app
    ports:
      - "8080:8080"
    restart: unless-stopped
